name: Deploy kaart to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/data/processed
          # Version the data URLs so browsers never combine a new page with cached old data.
          sed -E "s#(src=\"data/processed/[a-z_]+\.js)\"#\1?v=${GITHUB_SHA::7}\"#g" kaart.html > _site/index.html
          grep -c "?v=${GITHUB_SHA::7}" _site/index.html
          cp data/processed/*.js _site/data/processed/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
